name: TTSSample
options:
  bundleIdPrefix: com.nate.tts
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
  configs:
    Debug:
      KOTLIN_FRAMEWORK_BUILD_TYPE: debug
    Release:
      KOTLIN_FRAMEWORK_BUILD_TYPE: release

targets:
  TTSSample:
    type: application
    platform: iOS
    sources:
      - path: TTSSample
        type: group
      - path: Supertone_supertonic-2
        type: folder
        buildPhase: resources
    settings:
      base:
        INFOPLIST_FILE: TTSSample/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.nate.tts.sample
        FRAMEWORK_SEARCH_PATHS:
          - "$(SRCROOT)/../sample/build/bin/iosArm64/$(KOTLIN_FRAMEWORK_BUILD_TYPE)Framework"
          - "$(SRCROOT)/../sample/build/bin/iosSimulatorArm64/$(KOTLIN_FRAMEWORK_BUILD_TYPE)Framework"
          - "$(SRCROOT)/../library/build/cocoapods/synthetic/ios/build/Debug-iphoneos/onnxruntime-objc"
          - "$(SRCROOT)/../library/build/cocoapods/synthetic/ios/build/Debug-iphonesimulator/onnxruntime-objc"
          - "$(SRCROOT)/../library/build/cocoapods/synthetic/ios/build/Debug-iphoneos/XCFrameworkIntermediates/onnxruntime-c"
          - "$(SRCROOT)/../library/build/cocoapods/synthetic/ios/build/Debug-iphonesimulator/XCFrameworkIntermediates/onnxruntime-c"
        OTHER_LDFLAGS:
          - "-ObjC"
          - "-lc++"
          - "-framework ComposeApp"
          - "-framework onnxruntime_objc"
          - "-force_load"
          - "$(SRCROOT)/../library/build/cocoapods/synthetic/ios/build/$(CONFIGURATION)$(EFFECTIVE_PLATFORM_NAME)/XCFrameworkIntermediates/onnxruntime-c/onnxruntime.framework/onnxruntime"
          - "-weak_framework CoreML"
    preBuildScripts:
      - name: "Build Compose Multiplatform Framework"
        script: |
          export JAVA_HOME=$(/usr/libexec/java_home -v 21)
          cd "$SRCROOT/.."
          if [ "$CONFIGURATION" = "Debug" ]; then
            BUILD_TYPE="Debug"
          else
            BUILD_TYPE="Release"
          fi
          if [ "$PLATFORM_NAME" = "iphonesimulator" ]; then
            ./gradlew :sample:link${BUILD_TYPE}FrameworkIosSimulatorArm64
          else
            ./gradlew :sample:link${BUILD_TYPE}FrameworkIosArm64
          fi
        basedOnDependencyAnalysis: false
